# ==========================================
# HYPRLAND - CONFIGURAZIONE COMUNE
# ==========================================
source = ~/.dotfiles/themes/current/hyprland.conf

# --- AVVIO AUTOMATICO ---
# Avvia lo script che ruota le immagini ogni 3/5 minuti
exec-once = awww-daemon ; ~/.dotfiles/hypr/scripts/wallpaper.sh &
# Avvia e sblocca il portachiavi di sistema
exec-once = gnome-keyring-daemon --start --components=secrets

# --- VARIABILI D'AMBIENTE (Cursore Base) ---
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

general {
    # Spazio TRA le finestre (es. alzalo a 8 o 10 per distanziarle bene)
    gaps_in = 8

    # Spazio dai BORDI dello schermo (es. alzalo a 15 o 20)
    gaps_out = 20

    # ... altre impostazioni come border_size, col.active_border, ecc. ...
}

# --- TASTIERA E MOUSE ---
input {
    # Imposta il layout della tastiera in Italiano
    kb_layout = it
    
    # Comportamento del mouse (il focus segue il puntatore)
    follow_mouse = 1
}


decoration {
    rounding = 8

    # IL MOTORE DEL VETRO SMERIGLIATO
    blur {
        enabled = true
        size = 6           # Intensità della sfocatura (più alto = più sfocato)
        passes = 3         # Quante volte applicare il filtro (3 = effetto morbido ed elegante)
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1d2021aa)
    }
}

# --- ANIMAZIONI ---
animations {
    enabled = yes
    # Curve di animazione fluide
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- SCORCIATOIE DA TASTIERA (KEYBINDS) ---
# Dichiariamo il tasto Windows come modificatore principale ("SUPER")
$mainMod = SUPER

# 1. Comandi di Sistema e finestra
bind = ALT, F4, killactive,         # Chiude la finestra corrente
bind = $mainMod, C, killactive,     # Chiude la finestra corrente
bind = $mainMod, M, exit,           # Termina la sessione di Hyprland
bind = $mainMod, V, togglefloating, # Rende la finestra fluttuante (sovrapposta)
bind = $mainMod, F, fullscreen,     # Mette la finestra a schermo intero

# 2. Avvio Programmi Base
bind = $mainMod, T, exec, kitty          # Apre il terminale
bind = $mainMod, R, exec, pkill wofi || wofi --show drun --allow-images --image-size=24 --no-actions --style ~/.config/wofi/style.css

# 3. Spostamento del Focus (con le frecce direzionali)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# 4. Spostamento tra le Scrivanie Virtuali (Workspace)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# 5. Sposta la finestra attuale in un'altra Scrivania Virtuale
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# 5.5 Spostamento fisico della finestra attiva
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# 6. GESTIONE FINESTRE CON IL MOUSE (I più usati in assoluto)
# Tieni premuto il Tasto Windows e clicca per agire sulle finestre
bindm = $mainMod, mouse:272, movewindow   # Windows + Clic Sinistro: Sposta la finestra
bindm = $mainMod, mouse:273, resizewindow # Windows + Clic Destro: Ridimensiona la finestra

# 7. RIDIMENSIONAMENTO CON LA TASTIERA
# Usa Windows + CTRL + Frecce direzionali
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30

# 9. TASTI MULTIMEDIALI (Volume e Luminosità)
# Volume (usa i comandi standard di NixOS/Pipewire)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Luminosità Schermo (Portatile)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Scorri in avanti tra le finestre
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Scorri all'indietro (Alt + Shift + Tab)
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Ritorna all'ultima scrivania utilizzata (Ping-Pong)
bind = $mainMod, Tab, workspace, previous

# Mostra / Nascondi / Ricarica AGS
bind = $mainMod, B, exec, pkill ags || ags
