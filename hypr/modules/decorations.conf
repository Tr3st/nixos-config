source = ~/.dotfiles/themes/palette/current/hyprland.conf.tmpl-colors.conf

general {
    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $inactive
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = true
}

decoration {
    rounding = 15
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = yes
        range = 20
        render_power = 3
        color = rgba(1d2021ee)
    }
}

group {
    col.border_active = $tertiary

    groupbar {
        col.active = $surface
    }
}
