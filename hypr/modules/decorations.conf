# ==========================================
# HYPRLAND DECORATION & COLORS
# Design: Ultra-Clean / Caelestia Aesthetic
# ==========================================

# Carica la palette tonale generata da Matugen
source = ~/.dotfiles/themes/palette/current/hyprland.conf

general {
    # 1. IL RESPIRO (Gaps)
    # Aumentiamo i margini esterni per incorniciare il desktop come un quadro.
    gaps_in = 8
    gaps_out = 20
    
    # 2. LA STRUTTURA (Borders)
    # Un bordo presente (2px) ma rigorosamente a TINTA UNITA. 
    # Niente gradienti, solo pura coerenza cromatica.
    border_size = 1
    col.active_border = $primary
    
    # Il bordo inattivo scompare quasi nello sfondo, riducendo il rumore visivo.
    col.inactive_border = $surface_dim
    
    resize_on_border = true
}

decoration {
    # 3. LA MORBIDEZZA (Rounding)
    # Curvatura a 18px: il punto dolce perfetto tra il rigido (squadrato) e il cartoon (troppo tondo).
    rounding = 10
    
    blur {
        enabled = true
        # 4. IL VETRO SATINATO (Frosted Glass)
        # Pochi passaggi (passes=3) e size moderata (8) creano una sfocatura elegante 
        # senza "spalmare" troppo i pixel dello sfondo.
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        # Una leggerissima vibrazione (0.15) per evitare che i colori slavati sembrino grigi.
        vibrancy = 0.15
    }

    shadow {
        enabled = true
        # 5. LA LEGGEREZZA (Drop Shadow)
        # Ombra enorme (range 40) ma incredibilmente diffusa (power 4).
        # Questo stacca fisicamente la finestra dallo schermo, facendola levitare.
        range = 40
        render_power = 4
        
        # Ombre colorate che si fondono con l'atmosfera dell'immagine
        color = $shadow_color
        color_inactive = $shadow_inactive
    }
}

group {
    col.border_active = $primary

    groupbar {
        col.active = $surface
    }
}
