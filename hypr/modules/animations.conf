# ==========================================
# ANIMAZIONI FLUIDE - STILE iOS / CAELESTIA
# ==========================================

animations {
    enabled = yes

    # Curve di Bézier raffinate ed eleganti (stile iOS/macOS/Caelestia)
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = appleSmooth, 0.16, 1, 0.3, 1
    bezier = snappy, 0.1, 0.9, 0.2, 1.01
    bezier = liquid, 0.05, 0.9, 0.1, 1.05

    # Applicazione delle animazioni fluide per le finestre
    animation = windows, 1, 4, appleSmooth, slide
    animation = windowsIn, 1, 4, appleSmooth, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 4, snappy, slide

    # Bordi e dissolvenze pulite
    animation = border, 1, 5, default
    animation = borderangle, 1, 30, default, once
    animation = fade, 1, 3, smoothIn

    # Cambio workspace fluido e naturale
    animation = workspaces, 1, 5, appleSmooth, slide

    # Animazione globale per i Layer (Pop-up morbido stile macOS/Caelestia)
    animation = layers, 1, 5, appleSmooth, popin 80%
}
