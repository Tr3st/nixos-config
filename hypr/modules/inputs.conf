# ==========================================
# INPUT DEVICES CONFIGURATION
# ==========================================

input {
    # Manteniamo il layout italiano che ti serve
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options = 
    kb_rules =
    
    # Reattività della tastiera (fluidità di scrittura della rice)
    repeat_rate = 50
    repeat_delay = 300
    
    sensitivity = 0 # Sensibilità del mouse neutra
    numlock_by_default = true
    left_handed = false
    
    # Gestione del focus (puoi rimettere a 0 o false se preferisci che il focus non segua rigorosamente il mouse come nel tuo vecchio file)
    follow_mouse = 1 
    float_switch_override_focus = false

    touchpad {
        disable_while_typing = true
        # Nota: nel tuo laptop.conf avevi natural_scroll = yes, 
        # qui puoi lasciarlo a false o regolarlo a seconda delle preferenze del touchpad
        natural_scroll = false 
        clickfinger_behavior = false
        middle_button_emulation = true
        tap-to-click = true
        drag_lock = false
    }
    
    # Dispositivi touchscreen e tavolette grafiche (ereditati dalla rice)
    touchdevice {
        enabled = true
    }
    
    tablet {
        transform = 0
        left_handed = 0
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
