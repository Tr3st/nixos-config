# --- Orologio -----------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 96
    font_family = Rubik SemiBold
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %d %B" | sed 's/^./\U&/')"
    color = $on_surface_variant
    font_size = 22
    font_family = Rubik
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = Bentornato
    color = $on_surface_variant
    font_size = 15
    font_family = Rubik
    position = 0, 60
    halign = center
    valign = center
}

# --- Batteria (si nasconde da sola sul fisso, senza batteria) ------------
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | awk '{print " " $1 "%"}'
    color = $on_surface_variant
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 20, 20
    halign = left
    valign = top
}

# --- Campo password -------------------------------------------------------
input-field {
    monitor =
    size = 280, 62
    outline_thickness = 2
    rounding = 20

    outer_color = $outline
    inner_color = $surface_container
    font_color = $on_surface

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##888888">Password…</span>

    hide_input = false

    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 1500

    capslock_color = $error

    position = 0, -140
    halign = center
    valign = center
}
