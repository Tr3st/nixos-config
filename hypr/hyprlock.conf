# ~/.dotfiles/hypr/hyprlock.conf
#
# Va simlinkato/incluso in ~/.config/hypr/hyprlock.conf
# Sorge i colori da themes/current/, quindi cambiare tema
# (vedi README, sezione switch tema) aggiorna anche questo
# senza toccare un solo bit qui sotto.

source = ~/.dotfiles/themes/current/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0                 # 0 = richiede sempre la password, niente grazia
    no_fade_in = false
    no_fade_out = false
}

# ---------------------------------------------------------------
# Sfondo: stesso wallpaper del tema, sfocato — coerente con il
# "vetro smerigliato" già usato nel greeter SDDM.
# ---------------------------------------------------------------
background {
    monitor =
    path = ~/.dotfiles/themes/current/wallpaper.jpg
    color = $colorBackground   # fallback se il path non esiste

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------------
# Orologio
# ---------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $colorText
    font_family = $fontFamily
    font_size = 88
    font_weight = Light

    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %d %B")"
    color = $colorTextMuted
    font_family = $fontFamily
    font_size = 18

    position = 0, 60
    halign = center
    valign = center
}

# ---------------------------------------------------------------
# Nome utente (statico, giusto per contesto visivo)
# ---------------------------------------------------------------
label {
    monitor =
    text = "  $USER"
    color = $colorTextMuted
    font_family = $fontFamily
    font_size = 15

    position = 0, -60
    halign = center
    valign = center
}

# ---------------------------------------------------------------
# Campo password
# ---------------------------------------------------------------
input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    rounding = 12

    outer_color = $colorAccent
    inner_color = $colorSurface
    font_color = $colorText
    check_color = $colorAccentHover
    fail_color = $colorDanger

    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password</i>
    hide_input = false

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 1500

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 1.0

    position = 0, -120
    halign = center
    valign = center
}
