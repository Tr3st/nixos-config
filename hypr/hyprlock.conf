# I colori arrivano da qui:
source = ~/.dotfiles/themes/palette/matugen/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

