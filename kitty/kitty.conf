# ==========================================
# KITTY SETTINGS
# ==========================================

include ~/.dotfiles/themes/palette/current/kitty.conf

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        12.0

# Disattiva il popup di conferma chiusura
confirm_os_window_close 0

# Spaziamento interno (padding) per far "respirare" il testo
window_padding_width 12

# Trasparenza (se la gestisci da Kitty invece che da Hyprland)
# background_opacity 0.85

# Barra dei titoli e bordi
hide_window_decorations yes
enable_audio_bell no
