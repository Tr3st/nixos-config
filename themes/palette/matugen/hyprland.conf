# ==========================================
# TEMPLATE: HYPRLAND COLORS (MATUGEN)
# Stile: Caelestia / Liquid Glass
# ==========================================

# --- Superfici (Ideali per sfondi, layer e blur) ---
$background = rgb(17130b)
$surface = rgb(17130b)
$surface_dim = rgb(17130b)
$surface_bright = rgb(3e382f)
$surface_container = rgb(231f17)

# --- Colori d'Accento (Vividi, per finestre attive) ---
$primary = rgb(e9c16c)
$primary_container = rgb(5b4300)
$secondary = rgb(d8c4a0)
$tertiary = rgb(b0cfaa)

# --- Colori di Dettaglio (Testi e bordi inattivi) ---
$on_surface = rgb(ebe1d4)
$on_primary = rgb(3f2e00)
$outline = rgb(998f80)
$outline_variant = rgb(4d4639)

# --- Stati e Allarmi ---
$error = rgb(ffb4ab)
$error_container = rgb(93000a)

# ==========================================
# VARIABILI PRE-ASSEMBLATE (PRONTE PER L'USO)
# ==========================================

# Bordo Finestra Attiva: Un gradiente fluido stile Caelestia a 45 gradi
$active_border = $primary 
# Bordo Finestra Inattiva: Discreto, appena visibile per fondersi col vetro
$inactive_border = $outline_variant

# Colore Ombre: Morbide e profonde, basate sul colore di base del sistema
# (Il 99 e 4D finali aggiungono la trasparenza in formato esadecimale per rgba)
$shadow_color = rgba(17130b99)
$shadow_inactive = rgba(17130b4D)
