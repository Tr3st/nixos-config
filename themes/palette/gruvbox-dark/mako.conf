# ==========================================
# TEMPLATE: MAKO LIQUID GLASS STYLED
# ==========================================

max-history=10
sort=-time

# Font e Posizionamento (Top Right o Right)
font=JetBrainsMono Nerd Font 10
width=320
height=90
margin=15
padding=14
border-size=2
border-radius=16

# Timeout automatico
default-timeout=4000

# Colori stile "Vetro": SFONDO MOLTO TRASPARENTE + BORDO LUMINOSO
background-color=#3c3836aa
text-color=#ebdbb2
border-color=#d79921

[urgency=low]
border-color=#504945
default-timeout=3000

[urgency=high]
border-color=#fb4934
text-color=#fb4934
default-timeout=8000
