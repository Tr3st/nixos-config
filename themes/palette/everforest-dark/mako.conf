# ==========================================
# TEMPLATE: MAKO LIQUID GLASS STYLED
# ==========================================

max-history=10
sort=-time

# Font e Posizionamento (Top Right o Right)
font=JetBrainsMono Nerd Font 10
width=320
height=90
margin=15
padding=14
border-size=2
border-radius=16

# Timeout automatico
default-timeout=4000

# Colori stile "Vetro": SFONDO MOLTO TRASPARENTE + BORDO LUMINOSO
background-color=#343f44aa
text-color=#d3c6aa
border-color=#dbbc7f

[urgency=low]
border-color=#4f5b58
default-timeout=3000

[urgency=high]
border-color=#e67e80
text-color=#e67e80
default-timeout=8000
