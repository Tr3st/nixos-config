# ==========================================
# TEMPLATE: MAKO LIQUID GLASS STYLED
# ==========================================

max-history=10
sort=-time

# Font e Posizionamento (Top Right o Right)
font=JetBrainsMono Nerd Font 10
width=320
height=90
margin=15
padding=14
border-size=2
border-radius=16

# Timeout automatico
default-timeout=4000

# Colori stile "Vetro": SFONDO MOLTO TRASPARENTE + BORDO LUMINOSO
background-color=#24283baa
text-color=#c0caf5
border-color=#7aa2f7

[urgency=low]
border-color=#414868
default-timeout=3000

[urgency=high]
border-color=#f7768e
text-color=#f7768e
default-timeout=8000
