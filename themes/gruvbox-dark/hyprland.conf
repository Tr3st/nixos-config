# ==========================================
# TEMA: GRUVBOX DARK (PRO EDITION)
# ==========================================

general {
    col.active_border = rgb(d79921) rgb(d65d0e) 45deg
    col.inactive_border = rgb(3c3836)
    gaps_in = 5
    gaps_out = 10
}

decoration {
    rounding = 15
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = yes
        range = 20
        render_power = 3
        color = rgba(1d2021ee)
    }
}

animations {
    enabled = yes
    bezier = outBack, 0.05, 0.9, 0.1, 1.1
    animation = windows, 1, 5, outBack, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, outBack, slidevert
}

# NUOVA SINTASSI (windowrulev2) PER OPACITÀ
windowrulev2 = opacity 0.85 0.85,class:^(kitty)$
windowrulev2 = opacity 0.90 0.90,class:^(wofi)$
