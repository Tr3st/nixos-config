# Tema: Gruvbox Dark per Hyprland
general {
    gaps_in = 10               # Spazio tra le finestre
    gaps_out = 15             # Spazio tra le finestre e il bordo del monitor
    border_size = 2           # Spessore del bordo
    
    layout = dwindle          # Stile di affiancamento automatico


    # Bordo attivo: Sfumatura dal Giallo all'Arancione
    col.active_border = rgb(d79921) rgb(d65d0e) 45deg
    # Bordo inattivo: Grigio scuro del background
    col.inactive_border = rgb(3c3836)
}

decoration {
    rounding = 15
    shadow {
        enabled = yes
        range = 15
        render_power = 3
        color = rgba(1d2021ee)
    }
}
