# ~/.dotfiles/themes/gruvbox-dark/hyprlock-colors.conf
#
# Solo colori, nessun layout. hyprlock.conf fa `source` di questo
# file passando per themes/current, quindi per cambiare tema basta
# rifare il symlink (vedi README) — hyprlock.conf non si tocca.

$colorBackground   = rgba(29, 32, 33, 1.0)
$colorSurface      = rgba(40, 40, 40, 0.85)
$colorSurfaceAlt   = rgba(60, 56, 54, 1.0)
$colorBorder       = rgba(80, 73, 69, 1.0)

$colorText         = rgba(235, 219, 178, 1.0)
$colorTextMuted    = rgba(168, 153, 132, 1.0)

$colorAccent       = rgba(215, 153, 33, 1.0)
$colorAccentHover  = rgba(250, 189, 47, 1.0)
$colorDanger       = rgba(251, 73, 52, 1.0)

$fontFamily        = JetBrainsMono Nerd Font
