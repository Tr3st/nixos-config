# ==========================================
# TEMPLATE: HYPRLAND COLORS (MATUGEN)
# Stile: Caelestia / Liquid Glass
# ==========================================

# --- Superfici (Ideali per sfondi, layer e blur) ---
$background = rgb({{colors.background.default.hex_stripped}})
$surface = rgb({{colors.surface.default.hex_stripped}})
$surface_dim = rgb({{colors.surface_dim.default.hex_stripped}})
$surface_bright = rgb({{colors.surface_bright.default.hex_stripped}})
$surface_container = rgb({{colors.surface_container.default.hex_stripped}})

# --- Colori d'Accento (Vividi, per finestre attive) ---
$primary = rgb({{colors.primary.default.hex_stripped}})
$primary_container = rgb({{colors.primary_container.default.hex_stripped}})
$secondary = rgb({{colors.secondary.default.hex_stripped}})
$tertiary = rgb({{colors.tertiary.default.hex_stripped}})

# --- Colori di Dettaglio (Testi e bordi inattivi) ---
$on_surface = rgb({{colors.on_surface.default.hex_stripped}})
$on_primary = rgb({{colors.on_primary.default.hex_stripped}})
$outline = rgb({{colors.outline.default.hex_stripped}})
$outline_variant = rgb({{colors.outline_variant.default.hex_stripped}})

# --- Stati e Allarmi ---
$error = rgb({{colors.error.default.hex_stripped}})
$error_container = rgb({{colors.error_container.default.hex_stripped}})

# ==========================================
# VARIABILI PRE-ASSEMBLATE (PRONTE PER L'USO)
# ==========================================

# Bordo Finestra Attiva: Un gradiente fluido stile Caelestia a 45 gradi
$active_border = $primary 
# Bordo Finestra Inattiva: Discreto, appena visibile per fondersi col vetro
$inactive_border = $outline_variant

# Colore Ombre: Morbide e profonde, basate sul colore di base del sistema
# (Il 99 e 4D finali aggiungono la trasparenza in formato esadecimale per rgba)
$shadow_color = rgba({{colors.background.default.hex_stripped}}99)
$shadow_inactive = rgba({{colors.background.default.hex_stripped}}4D)
